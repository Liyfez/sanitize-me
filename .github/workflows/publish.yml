name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@liyfez'

      - name: Run Tests
        run: npm test

      - name: Publish to GitHub Packages
        run: |
          npm publish || echo "Package publish skipped or already exists"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
